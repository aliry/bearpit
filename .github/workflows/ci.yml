name: CI

on:
  push:
    branches: [main]
  # NEVER pull_request_target: it runs with repository write permissions and the base repo's
  # secrets, against a fork's code.
  pull_request:

# Read-only by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to a commit SHA, not a tag — a tag is mutable, and this workflow can read
      # the repository. Same "pin everything" rule the project applies to container images.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        # Includes the two repository guards: tests/test_public_surface.py (no private-fork
        # vocabulary) and tests/test_deploy_env.py (no weak or undocumented deploy defaults).
        run: uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans history, not just the tip

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
