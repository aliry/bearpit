name: CI

on:
  push:
    branches: [main]
  # NEVER pull_request_target: it runs with repository write permissions and the base repo's
  # secrets, against a fork's code.
  pull_request:

# Read-only by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to a commit SHA, not a tag — a tag is mutable, and this workflow can read
      # the repository. Same "pin everything" rule the project applies to container images.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        # Includes the two repository guards: tests/test_public_surface.py (no private-fork
        # vocabulary) and tests/test_deploy_env.py (no weak or undocumented deploy defaults).
        run: uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans history, not just the tip

      # The binary, not gitleaks-action. The action writes to the GitHub API to post results, which
      # fails outright under this workflow's read-only token AND on Dependabot PRs, whose token is
      # restricted no matter what we grant — "Resource not accessible by integration", on a job
      # whose entire purpose is to be trustworthy. Running the binary needs no token, no API call
      # and no third-party action: it scans and sets an exit code, which is all a gate should do.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact --config .gitleaks.toml
