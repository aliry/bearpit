# Dependency updates. Grouped and monthly on purpose: this project pins deliberately
# (see CONTRIBUTING), and a stream of single-package PRs trains you to merge without reading.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 3

  # Workflow actions are pinned to commit SHAs, so this is how they get updated at all.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
