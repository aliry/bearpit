name: Task or proposal
description: A change to build, or an idea to discuss.
labels: ["type/task"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today. Describe the situation, not the solution.
    validations: { required: true }

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would build, and roughly how.

  - type: checkboxes
    id: principles
    attributes:
      label: Design principles
      description: >
        `docs/architecture.md` §2 and §6 are locked; a change that contradicts them needs an ADR.
        Tick any this proposal touches, so the discussion starts in the right place.
      options:
        - label: "Adds mid-run control over an agent (agents are configured at birth only)"
        - label: "Enforces something outside the four control boundaries"
        - label: "Converts a scenario-author 'law' into platform 'physics'"
        - label: "None of the above"
