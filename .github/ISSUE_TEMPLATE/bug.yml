name: Bug report
description: Something behaves differently from how it is documented.
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues do not belong here.** Use private vulnerability reporting — see SECURITY.md.

        In-realm adversarial behaviour between agents (deception, bluffing, exploiting a scenario's
        rules) is intended and is not a bug. See the trust model in SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations: { required: true }

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The scenario package and the exact commands. A minimal manifest beats a description.
      render: shell
    validations: { required: true }

  - type: input
    id: provider
    attributes:
      label: Model pipeline
      description: Which provider was active, and which model the affected agent resolved to.
      placeholder: "openrouter / anthropic/claude-sonnet-5"

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        Relevant output. `arealm status <realm>` and the realm's report are usually the fastest
        way to show what actually ran — the manifest is not what runs.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: "`arealm version`, or the commit."
    validations: { required: true }
