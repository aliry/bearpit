# gitleaks configuration.
#
# The default ruleset is kept in full; this file only records the handful of places where a
# credential-shaped string is the POINT of the code. Each entry is path-scoped and explained,
# because a broad allowlist is how a secret scanner becomes decorative.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  description = """
  Test fixtures that must LOOK like credentials to test the code that handles them:

    * tests/test_redact.py and tests/test_runner.py — invented Matrix and LiteLLM values, used to
      prove that platform-minted credentials are masked before reaching the append-only Chronicle.
      A fixture that did not resemble a token would still pass (redaction is literal matching) but
      would make the test unreadable to the next person.
    * tests/test_core_schema.py — deliberately key-SHAPED strings asserting the schema REJECTS
      them, so a real secret can never be committed into a portable scenario package.

  None of these has ever been valid anywhere.
  """
  paths = [
    '''tests/test_redact\.py''',
    '''tests/test_runner\.py''',
    '''tests/test_core_schema\.py''',
  ]
