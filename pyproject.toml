[project]
name = "bearpit"
version = "0.1.0"
description = "Run realms of autonomous AI agents that collaborate or compete on user-defined projects"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Bearpit Authors" }]
keywords = ["ai", "agents", "multi-agent", "llm", "simulation", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "asyncpg>=0.31.0",
    "cryptography>=49.0.0",
    "docker>=7.1.0",
    "fastapi>=0.140.7",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=1.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.51",
    "typer>=0.26.8",
    "uvicorn[standard]>=0.51.0",
]

[project.urls]
Homepage = "https://github.com/aliry/bearpit"
Documentation = "https://github.com/aliry/bearpit/tree/main/docs"
Repository = "https://github.com/aliry/bearpit"
Issues = "https://github.com/aliry/bearpit/issues"

[project.scripts]
pit = "bearpit.cli.main:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

# Without these a wheel built from a working tree carries the local caches — .mypy_cache alone was
# 5.4 MB of a 6.2 MB uncompressed wheel.
[tool.uv.build-backend]
source-exclude = ["**/.mypy_cache/**", "**/__pycache__/**", "**/.ruff_cache/**", "**/*.py[cod]"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes", "deploy"]  # throwaway spike/poc scripts have no quality bar

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Framework defaults: both return an immutable descriptor, not a shared mutable. B008 only
# fires on a mutable ANNOTATION, so `--param: list[str]` trips it where `--yes: bool` does not.
extend-immutable-calls = [
    "fastapi.File", "fastapi.Depends", "fastapi.Query",
    "typer.Option", "typer.Argument",
]

[tool.mypy]
strict = true
# The platform only. A locally-installed provider plugin type-checks itself, from its own package
# (`uv run --group <name> mypy -p <package>`); naming one here would put it in the platform's own
# published metadata.
packages = ["bearpit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the network / a real model endpoint; skipped unless SCRIBE_LIVE=1",
]
